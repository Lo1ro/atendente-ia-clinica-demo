<!-- Titulo NEUTRO de proposito: o preview de link do WhatsApp/Instagram le o HTML
     sem executar JS, entao ele nunca ve a personalizacao de ?negocio=. Com o nome
     de um cliente fixo aqui, todo lead recebia um cartao com o nome de OUTRO
     negocio. O JS troca o title pelo nome real assim que a pagina abre (linha ~191). -->

  .me{align-self:flex-end;background:#005c4b;border-top-right-radius:2px;}
  .time{font-size:10px;color:#8aa;margin-top:3px;text-align:right;}
  .quick{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px 2px;}
  .chip{background:#202c33;color:#9fd;border:1px solid #2a3942;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer;}
  .chip:hover{background:#2a3942;}
  .bar{display:flex;gap:8px;padding:10px;background:#202c33;align-items:center;}
  .bar input{flex:1;background:#2a3942;border:none;border-radius:20px;padding:11px 14px;color:#e9edef;font-size:14px;outline:none;}

  .typing{align-self:flex-start;color:#8aa;font-size:13px;padding:2px 6px;font-style:italic;}
  .tag{text-align:center;font-size:11px;color:#5e7a86;margin:4px 0;}

const chat=document.getElementById('chat'), inp=document.getElementById('inp'), quick=document.getElementById('quick');
function now(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function add(text,who){const m=document.createElement('div');m.className='msg '+(who==='me'?'me':'bot');m.innerHTML=text.replace(/\n/g,'<br>')+'<div class="time">'+now()+(who==='me'?' ✓✓':'')+'</div>';chat.appendChild(m);chat.scrollTop=chat.scrollHeight;}
function typing(cb){const t=document.createElement('div');t.className='typing';t.textContent='digitando...';chat.appendChild(t);chat.scrollTop=chat.scrollHeight;setTimeout(()=>{t.remove();cb();},700+Math.random()*500);}
function botSay(text){typing(()=>add(text,'bot'));}
function setQuick(arr){quick.innerHTML='';arr.forEach(q=>{const c=document.createElement('div');c.className='chip';c.textContent=q;c.onclick=()=>handle(q);quick.appendChild(c);});}

// nicho é a base; o perfil do estabelecimento sobrescreve o que existir nele
const ID=(Q.get('id')||'').trim().toLowerCase();
const C=Object.assign({},NICHOS[NICHO]||NICHOS.estetica,NEGOCIOS[ID]||{});

const ENDERECO=C.endereco||(CIDADE
  ?'📍 Estamos no Centro de '+CIDADE+'. Tem estacionamento fácil por perto! '+C.endFim
  :'📍 Estamos na Rua das Flores, 123 — Centro. Tem estacionamento na porta! '+C.endFim);
const HORARIO=C.horario||'🕘 Atendemos Seg a Sex das 9h às 19h e Sáb das 9h às 14h. Quer marcar um horário?';
const SAUDACAO='Oi! 😊 Aqui é a assistente virtual '+DA+' '+NEGOCIO+'. Posso te ajudar com '+C.ajudas+'. O que você precisa?';
const TCHAU='Imagina! 💕 Qualquer coisa é só chamar. Te espero '+NA+' '+NEGOCIO+'!';
const HUMANO='Sem problema! 🙋 Vou chamar uma pessoa da equipe. Enquanto isso, posso já adiantar seu atendimento se quiser.';

// aplica identidade no cabeçalho e no título da aba
if(RAW_NEG){
  document.getElementById('nm').textContent=RAW_NEG;
  document.getElementById('av').textContent=RAW_NEG[0].toUpperCase();
  document.title='Atendente IA — '+RAW_NEG+' (Demo)';
}

const REGRAS=[
  ...(C.extras||[]),
  [/(pre[çc]o|valor|quanto|tabela)/,C.precos],
  [C.agendaRe,'FLOW'],
  [C.servicosRe,C.servicos],
  [/(endere[çc]o|onde|local|fica|chegar)/,ENDERECO],
  [/(hor[áa]rio de func|abre|aberto|atende|funciona)/,HORARIO],
  [/(humano|atendente|pessoa|falar com algu)/,HUMANO],
  [/(oi|ol[áa]|bom dia|boa tarde|boa noite|tudo bem)/,SAUDACAO],
  [/(obrigad|valeu|brigad)/,TCHAU]
];

let step=-1, resp=[];
function handle(text){
  add(text,'me'); inp.value='';
  const t=text.toLowerCase();

  // fluxo guiado (agendamento/pedido/orçamento, conforme o nicho)
  if(step>=0){
    resp.push(text); step++;
    if(step<C.flow.length){ setQuick(C.flow[step].chips); return botSay(C.flow[step].q); }
    step=-1; setQuick(C.chips); return botSay(C.confirma(resp));
  }

  for(const [re,r] of REGRAS){
    if(re.test(t)){
      if(r==='FLOW'){ step=0; resp=[]; setQuick(C.flow[0].chips); return botSay(C.flow[0].q); }
      return botSay(r);
    }
  }
  return botSay(C.fallback);
}

document.getElementById('send').onclick=()=>{ if(inp.value.trim()) handle(inp.value.trim()); };
inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&inp.value.trim()) handle(inp.value.trim()); });

// abertura
setTimeout(()=>botSay('Oi! 😊 Seja bem-vindo '+AO+' *'+NEGOCIO+'*. Sou a assistente virtual e atendo 24h por aqui.\nComo posso te ajudar hoje?'),400);
setTimeout(()=>setQuick(C.chips),1300);
</script>
